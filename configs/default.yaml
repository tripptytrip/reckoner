# reckoner — default configuration
#
# This file and the dataclass defaults in src/reckoner/config.py must agree
# exactly; tests/test_config.py::test_default_yaml_matches_dataclass_defaults
# pins that identity. Two writable spellings of one number that are allowed to
# drift is how a run ends up honouring the copy nobody edited.
#
# A campaign that legitimately needs different values gets its OWN file in
# configs/ (configs/m1.yaml, and so on) — it does not edit this one.
#
# That convention is load-bearing, not tidiness. Because this file equals the
# dataclass defaults exactly, a campaign config's `config_diff()` against the
# defaults IS its lever list, so its test can assert that the diff equals the
# set the PREREG registered — one-lever-per-round as an executable property
# rather than a reviewed one. See config_diff()'s docstring.
#
# Provenance tags, as in config.py:
#   [spec §N]       pinned by experiment2_math_base625_spec.md
#   [plan chunk N]  pinned by experiment2_agent_plan.md
#   [v1.1]          pinned by the par-game amendment
#   [provisional]   a placeholder the named chunk owns and will set
#
# The strict loader rejects unknown keys outright. That is deliberate: a
# near-miss on a real field leaves a plausible default in place and reads as a
# request that changed nothing.

seed: 42  # [inherited law] one seed fans out to all RNGs

# --- the environment contract [plan chunk 3] --------------------------------
episode:
  step_cap: 24            # [plan chunk 3] cap reached => z = -1, same as over par
  simplify_equiv_k: 32    # [spec §3] random-assignment equivalence, k=32 draws
  equiv_prime: 2147483647 # 2**31 - 1; largest Mersenne prime keeping r*r in int64

# --- the par game [spec §3, v1.1] -------------------------------------------
# z in {+1 strictly under par, 0 equal, -1 over par or step cap}. The opponent
# enters the label, never the search.
par:
  bfs_exact_max_depth: 6  # [spec §3] BFS-exact par is canonical to depth 6
  concede_enabled: false  # [v1.1] implemented, default off, calibration deferred
  concede_k: 2            # inert while concede_enabled is false; NOT calibrated

# --- the snapshot league [v1.1, plan chunk 9] -------------------------------
# Chunk 9 ports CheckpointPool and fills this out. It exists now because
# par_from_pool_frac needed an owning section that was not `par` — the key is
# spelled exactly as the plan, the amendment and every future PREREG spell it.
league:
  par_from_pool_frac: 0.20  # [v1.1] pool-derived par; par escalates with the model
  # [chunk 9] membership and sampling, declared rather than emergent. The Phase-1
  # anchor seeds the pool — otherwise par_from_pool_frac is dead until snapshots
  # accumulate, and the anchor is the natural rung-zero member.
  seed_pool_with_anchor: true
  snapshot_every: 1        # [provisional — chunk 9] enrollment cadence
  pool_size: 8
  pool_sample: uniform

# --- model [plan chunk 6] ---------------------------------------------------
model:
  param_budget_min: 2000000  # [spec §4] "~2-7M parameters" — the pinned envelope
  param_budget_max: 7000000
  value_classes: 3           # [v1.1] 3-class W/D/L vs par (reverses §8 dec. 1)
  steps_aux_head: true       # [v1.1] steps-to-solve auxiliary regression
  d_model: 256               # [chunk 6] sized to the 2-7M envelope
  n_layers: 6                # [chunk 6] 8 would press the ceiling at ~6.6M
  n_heads: 8                 # [chunk 6]
  d_ff: 1024                 # [chunk 6]
  dropout: 0.1               # [chunk 6]
  seq_len: 512               # [chunk 6, measured] ~1.5x the reachable-state p100 (332)
  max_sites: 192             # [chunk 6, measured] ~1.5x the reachable-state p100 (121)
  d_policy: 128              # [chunk 6] bilinear rule x site dim

# --- search [plan chunk 7] --------------------------------------------------
search:
  # [plan §8 decision 5] The sharpest porting hazard in the plan, made a config
  # key so no run can silently do the wrong backup: there is no opponent, so
  # backup does NOT negate per ply. The loader rejects any other value.
  perspective: single
  sims: 48          # [provisional — chunk 7] top of the {6,16,31,48} grid
  gumbel_m: 16      # [provisional — chunk 7] top of the {3,5,12,16} grid
  c_visit: 50.0     # [provisional — chunk 7]
  c_scale: 1.0      # [provisional — chunk 7]
  # [chunk 8 — DECIDED] concurrent SEARCHES pooling leaves, never leaves within
  # one tree; within-tree pooling was removed as unsound (A3, was batch_leaves).
  batch_searches: 512
  root_noise: true  # [plan chunk 7] the SELF-PLAY value; suites/ladder run false

# --- training [plan chunks 8, 9] --------------------------------------------
train:
  # [plan chunk 9] on from day one: the checker, not the model's own Q, decides
  # solved, so the blend's self-referential hazard is structurally absent here.
  value_q_mse_weight: 0.5
  rehearsal_frac: 0.65     # [M1-A4 §5] the sweep's value; wire and value were separate decisions
  batch_size: 128         # [chunk 8 — DECIDED by the timing slice; 512 was provisional]
  ring_holdout_frac: 0.1  # [chunk 9] switch-criterion slice; held out from training,
                          # deliberately IN-DISTRIBUTION (valuegate.evaluate_head)
  lr_schedule: cosine     # [plan chunk 8] constant | cosine; loader rejects others
  lr_warmup_steps: 200    # [provisional — chunk 8]
  lr: 0.0002              # [provisional — chunk 8]
  weight_decay: 0.0001    # [provisional — chunk 8]
  grad_clip: 1.0          # [provisional — chunk 8]
  train_steps_per_iter: 400  # [provisional — chunk 9]
  replay_capacity: 500000    # [provisional — chunk 9]
  policy_loss_weight: 1.0    # [provisional — chunk 8]
  value_loss_weight: 1.0     # [provisional — chunk 8]
  steps_loss_weight: 1.0     # [provisional — chunk 8]
  nan_abort_frac: 0.01       # [plan chunk 8] NaN-skip guard + abort
  nan_abort_min_steps: 20

# --- numerics [chunk 9 part 0] ----------------------------------------------
# Which dtype produced a number, decided once so it is never a question later.
numerics:
  # fp32 is the regime the GPU/CPU equivalence gate LICENSED — tier 1 exact,
  # 512/512 argmax and top-8, all four width buckets (F-12). Every gate number,
  # eval pass and ladder measurement runs here. The loader rejects anything else.
  measure_dtype: fp32
  # bf16 per AGENTS.md §4.5 (autocast, fp32 master weights). Training is guarded
  # by the NaN-skip kit and its loss curve, not by cross-device identity, so it
  # does not need the licensed regime and does need the throughput. bf16's only
  # cross-device number is informational: 511/512 argmax at max|delta| 1.369e-01.
  train_dtype: bf16

# --- generator and the frozen instruments [plan chunk 5] --------------------
generator:
  max_bfs_depth: 6            # depth labels are MEASURED by BFS, not assumed
  train_set_size: 100000      # [plan chunk 5] 100K-problem training set
  suite_problems_per_depth: 200  # [plan chunk 5] solve_in_N.jsonl, 200 each
  suite_depths: [1, 2, 3, 4, 5, 6]

# --- the ladder [plan chunks 10, 11] ----------------------------------------
ladder:
  ladder_every: 5           # [plan chunk 11] campaign M1 runs at --ladder-every 5
  bootstrap_resamples: 10000  # [inherited law] paired-difference bootstrap
  problems_per_pass: 200    # [provisional — chunk 10]

# --- the campaign [M1-A2] ----------------------------------------------------
# Extent, treatment size, and the thread pins. These were absent, which is why
# the driver could not take its extent from fingerprinted config and honour the
# no-behavioural-flags rule at the same time.
campaign:
  iterations: 20            # [M1-A2] HARD analysis point; may NOT be raised after launch
  episodes_per_iteration: 400  # [M1-A2 §3] CHOSEN-not-derived; consequences computed on the page
  intra_op_threads: 8       # [M1-A2 §4] EXERCISED pin — the clamp that made the licence's parity possible
  interop_threads: 32       # [M1-A2 §4] OBSERVED pin — constant on both hosts, undiscriminated
